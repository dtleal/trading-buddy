name: day-trading-buddy

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      # Host port comes from .env (BACKEND_PORT, default 8000). On the shared
      # KVM box we set it to 8057 so we never collide with polymarket / kalshi.
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      # Raw order-flow tape (JSONL per UTC day) recorded by the ingest route —
      # bind-mounted so backtest data survives image rebuilds.
      - ../data/orderflow_tape:/app/data/orderflow_tape

  postgres:
    image: postgres:16-alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Empty → bundle auto-detects the host at runtime from window.location,
        # so the same image works whether you load the app at localhost,
        # 192.168.x.x:3000 (phone on same Wi-Fi), or a remote hostname.
        NEXT_PUBLIC_API_URL: ""
    ports:
      # Host port comes from .env (FRONTEND_PORT, default 3000). KVM uses 3057.
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
