[project]
name = "day-trading-buddy"
version = "0.1.0"
description = "Macro context co-pilot for day trading USTEC, S&P 500 and Gold."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diego Tavares Leal" }]

dependencies = [
    # HTTP & parsing
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0.11",

    # Market data
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",

    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # CLI & rendering
    "typer>=0.12",
    "rich>=13.7",

    # Resilience
    "tenacity>=8.4",

    # Cache
    "redis[hiredis]>=5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",

    # LLM
    "anthropic>=0.34",
]

[project.optional-dependencies]
# Heavy ML stack — opt-in. Default sentiment classifier is keyword-based.
ml = [
    "transformers>=4.42",
    "torch>=2.3",
]

[project.scripts]
dtb = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "black>=24.4",
    "isort>=5.13",
    "mypy>=1.10",
    "types-beautifulsoup4>=4.12",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "use_cases", "cli", "db"]

[tool.hatch.build.targets.wheel.force-include]
"container.py" = "container.py"
"scheduler.py" = "scheduler.py"
"settings.py" = "settings.py"

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["core", "adapters", "use_cases", "cli", "db", "container", "scheduler", "settings"]
src_paths = [".", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "fredapi.*",
    "feedparser.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that hit external APIs, Postgres, or Redis",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["core", "adapters", "use_cases", "cli", "db", "container", "scheduler", "settings"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
